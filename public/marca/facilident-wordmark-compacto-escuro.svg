<title id="t">Facilident</title>
<desc id="d">Assinatura tipográfica da Facilident sem o descritor, em versão para fundo escuro, derivada do kit oficial: mantém a palavra e os dois pontos de acento, remove o grupo "software de gestão odontológica" — que a 22px de cabeçalho seria ilegível.</desc>
