name: facilident

# `docker compose up` sobe tudo pronto: banco migrado, semeado e app servindo.
# Nenhum passo manual, nenhum .env obrigatório — os defaults abaixo servem para
# desenvolvimento. Em produção, passe as variáveis pelo ambiente.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facilident}
      POSTGRES_USER: ${POSTGRES_USER:-facilident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facilident_dev}
      # Coleção pt-BR: ordenação de nome de paciente com acento sai correta.
      LANG: pt_BR.UTF-8
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Exposto só no loopback. Banco de prontuário não escuta na rede.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `migrate` só começa quando o banco realmente aceita conexão.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-facilident} -d ${POSTGRES_DB:-facilident}']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: aplica migrations (0000 schema + 0001 triggers/EXCLUDE) e semeia.
  # Idempotente — roda em todo `up` e termina.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-facilident}:${POSTGRES_PASSWORD:-facilident_dev}@db:5432/${POSTGRES_DB:-facilident}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: dev
    environment:
      # A role de APLICAÇÃO. Não é dona das tabelas e não tem BYPASSRLS — é o que
      # faz a Row Level Security valer, em vez de ser decorativa. Dono de tabela
      # ignora política, e com a credencial do dono aqui todo o isolamento da
      # `drizzle/0023` seria enfeite: o teste adversarial passaria com o vazamento
      # de pé.
      #
      # Precisa de `./docker/credencial-app.sh` uma vez (a migration cria a role
      # sem LOGIN; senha em arquivo SQL versionado é senha pública).
      #
      # Migration, seed, `db:verificar` e backup continuam no DONO, de propósito:
      # são operação, não aplicação. Quem aplica DDL e quem atende requisição não
      # devem ser a mesma credencial.
      DATABASE_URL: postgres://facilident_app:${APP_DB_PASSWORD:-facilident_app_dev}@db:5432/${POSTGRES_DB:-facilident}
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-trocar-em-producao-0123456789abcdef}
      AUTH_TRUST_HOST: 'true'
      # Cifra o segredo do segundo fator em repouso (lib/auth/mfaSegredo.ts). Tem
      # default de desenvolvimento pelo mesmo motivo do AUTH_SECRET: sem ele o
      # `docker compose up` quebraria. Produção se RECUSA a subir com este valor —
      # com a chave pública, um dump do banco entrega o MFA de todos os usuários.
      MFA_CHAVE: ${MFA_CHAVE:-dev-mfa-key-trocar-em-producao-0123456789abcdef}
      # WhatsApp: 'simulado' é o padrão de propósito. Ver
      # lib/mensageria/provedor/index.ts — cair para o provedor real por omissão
      # mandaria mensagem de teste para telefone de paciente.
      WHATSAPP_PROVEDOR: ${WHATSAPP_PROVEDOR:-simulado}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      # Segredos com default de desenvolvimento, recusados em produção por
      # lib/auth/segredo.ts. Sem eles o webhook responde 403 a tudo.
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-dev-whatsapp-app-secret-trocar-em-producao}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-verify-token}
      # Anexos do prontuário (Fase 10). Disco é o padrão; 's3' exige as
      # credenciais e NÃO cai para disco por omissão.
      ARMAZENAMENTO: ${ARMAZENAMENTO:-disco}
      ARMAZENAMENTO_RAIZ: /anexos
      # Desliga o segundo fator NESTE serviço de desenvolvimento: o login aceita
      # qualquer código (o formulário já vem com 000000). O serviço `app-prod`
      # NÃO recebe esta chave, e o app se recusa a subir em produção com ela —
      # ver lib/auth/mfa.ts. Para testar o fluxo real de MFA:
      #   MFA_DESABILITADO=false docker compose up app
      MFA_DESABILITADO: ${MFA_DESABILITADO:-true}
      S3_HOST: ${S3_HOST:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      migrate:
        # App só sobe depois do banco migrado e semeado.
        condition: service_completed_successfully
    volumes:
      - .:/app
      # Volume nomeado: radiografia não pode morar na camada do container, senão
      # desaparece no próximo build.
      - anexos:/anexos
      # Volumes anônimos: node_modules e .next do container não são
      # sobrescritos pelo bind mount do host (binários podem diferir).
      - /app/node_modules
      - /app/.next

  # Variante de produção: `docker compose --profile prod up app-prod`
  app-prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    environment:
      # A role de APLICAÇÃO. Não é dona das tabelas e não tem BYPASSRLS — é o que
      # faz a Row Level Security valer, em vez de ser decorativa. Dono de tabela
      # ignora política, e com a credencial do dono aqui todo o isolamento da
      # `drizzle/0023` seria enfeite: o teste adversarial passaria com o vazamento
      # de pé.
      #
      # Precisa de `./docker/credencial-app.sh` uma vez (a migration cria a role
      # sem LOGIN; senha em arquivo SQL versionado é senha pública).
      #
      # Migration, seed, `db:verificar` e backup continuam no DONO, de propósito:
      # são operação, não aplicação. Quem aplica DDL e quem atende requisição não
      # devem ser a mesma credencial.
      DATABASE_URL: postgres://facilident_app:${APP_DB_PASSWORD:-facilident_app_dev}@db:5432/${POSTGRES_DB:-facilident}
      NODE_ENV: production
      # Sem `:?` de propósito: o compose interpola TODOS os serviços mesmo os
      # de outro profile, e um `:?` aqui quebraria `docker compose up` normal.
      # A exigência real é em runtime, em lib/auth/segredo.ts — o app se recusa
      # a subir em produção com o segredo de desenvolvimento.
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-trocar-em-producao-0123456789abcdef}
      AUTH_TRUST_HOST: 'true'
      # Sem default próprio de propósito: se a variável não vier do .env, o valor de
      # desenvolvimento entra e o app se recusa a subir — que é o comportamento certo
      # para produção. A exigência real é em runtime, em lib/auth/segredo.ts.
      MFA_CHAVE: ${MFA_CHAVE:-dev-mfa-key-trocar-em-producao-0123456789abcdef}
      WHATSAPP_PROVEDOR: ${WHATSAPP_PROVEDOR:-simulado}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      ARMAZENAMENTO: ${ARMAZENAMENTO:-disco}
      ARMAZENAMENTO_RAIZ: ${ARMAZENAMENTO_RAIZ:-/anexos}
      S3_HOST: ${S3_HOST:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - anexos:/anexos
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ── Despachante do WhatsApp ────────────────────────────────────────────────
  # `npm run whatsapp:despachar` é seguro de rodar em paralelo e quantas vezes
  # quiser (chave de idempotência + SKIP LOCKED), e o horário de envio já está
  # gravado em `agendado_para`. Faltava só alguém chamá-lo: sem isto, a fila
  # enche e nenhum lembrete sai — o pior dos mundos, porque a tela mostra as
  # mensagens "pendentes" e ninguém desconfia do relógio.
  #
  # Um serviço com laço próprio, em vez de cron do host: cron do host depende de
  # alguém lembrar de instalar a linha, e essa pessoa não é a mesma que sobe o
  # compose. Aqui o despacho sobe junto com o resto ou não sobe nada.
  despachante:
    profiles: ['prod']
    build:
      context: .
      target: migrate # tem tsx e o código; não serve HTTP
    restart: unless-stopped
    command: >
      sh -c 'while true; do
        npm run whatsapp:despachar || echo "despacho falhou; tentando de novo no próximo ciclo";
        sleep ${DESPACHO_INTERVALO_SEGUNDOS:-600};
      done'
    environment:
      # A role de APLICAÇÃO. Não é dona das tabelas e não tem BYPASSRLS — é o que
      # faz a Row Level Security valer, em vez de ser decorativa. Dono de tabela
      # ignora política, e com a credencial do dono aqui todo o isolamento da
      # `drizzle/0023` seria enfeite: o teste adversarial passaria com o vazamento
      # de pé.
      #
      # Precisa de `./docker/credencial-app.sh` uma vez (a migration cria a role
      # sem LOGIN; senha em arquivo SQL versionado é senha pública).
      #
      # Migration, seed, `db:verificar` e backup continuam no DONO, de propósito:
      # são operação, não aplicação. Quem aplica DDL e quem atende requisição não
      # devem ser a mesma credencial.
      DATABASE_URL: postgres://facilident_app:${APP_DB_PASSWORD:-facilident_app_dev}@db:5432/${POSTGRES_DB:-facilident}
      NODE_ENV: production
      WHATSAPP_PROVEDOR: ${WHATSAPP_PROVEDOR:-simulado}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  anexos:
